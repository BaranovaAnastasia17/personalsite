<svg xmlns="http://www.w3.org/2000/svg" width="930" height="190" viewBox="0 0 930 190" role="img" aria-labelledby="tt dd"><title id="tt">Workflow for graduation document verification</title><desc id="dd">Input XLSX and DOCX, normalise, apply checks, produce a report of discrepancies</desc>
