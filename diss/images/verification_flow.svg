<g font-family="Arial, sans-serif" fill="#234968" font-size="15" text-anchor="middle">
<rect x="20" y="48" width="165" height="87" rx="13" fill="#eaf4f9" stroke="#88bad8" stroke-width="2"/><text x="102" y="79">Входные документы</text><text x="102" y="102" font-size="14">DOCX / XLSX</text>
<rect x="205" y="48" width="165" height="87" rx="13" fill="#eaf4f9" stroke="#88bad8" stroke-width="2"/><text x="287" y="79">Извлечение</text><text x="287" y="102" font-size="14">и нормализация</text>
